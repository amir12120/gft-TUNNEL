name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (e.g. v1.0.0)
        required: true

permissions:
  contents: write

jobs:
  smoke:
    name: Smoke test before releasing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run the smoke test suite
        run: |
          chmod +x gft install.sh lib/*.sh test/*.sh test/stub/*
          bash test/smoke.sh

  release:
    name: Publish the release
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "version=${tag#v}" >>"$GITHUB_OUTPUT"
          echo "releasing $tag"

      - name: Verify VERSION matches the tag
        run: |
          file_version="$(cat VERSION)"
          tag_version="${{ steps.ver.outputs.version }}"
          if [ "$file_version" != "$tag_version" ]; then
            echo "::error::VERSION ($file_version) does not match the tag ($tag_version)"
            exit 1
          fi
          echo "VERSION matches the tag"

      - name: Build the release archive
        run: |
          name="gft-tunnel-${{ steps.ver.outputs.version }}"
          mkdir -p "dist/$name"
          cp -r gft install.sh lib systemd VERSION README.md README.fa.md \
                CHANGELOG.md LICENSE "dist/$name/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          sha256sum "dist/$name.tar.gz" > "dist/$name.tar.gz.sha256"
          ls -l dist

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            "dist/gft-tunnel-${{ steps.ver.outputs.version }}.tar.gz" \
            "dist/gft-tunnel-${{ steps.ver.outputs.version }}.tar.gz.sha256" \
            --title "gft-TUNNEL ${{ steps.ver.outputs.tag }}" \
            --generate-notes
